[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "justtest-observability"
version = "0.1.0"
description = "A small, dependency-light observability platform foundation."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "justtest contributors"}]

[project.scripts]
justtest-observe = "justtest_observability.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
