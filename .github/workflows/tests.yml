name: tests

on:
  push:
    branches: [main, "feat/**", "fix/**", "refactor/**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: python -m justtest_observability --database .tmp/telemetry.db status
      - name: Native host collector smoke test
        run: python -m justtest_observability --database .tmp/telemetry.db --tag ci=true collect-once
      - name: Compile sources
        run: python -m compileall -q src tests
