name: windows-exe

on:
  push:
    branches: [main, "feat/**", "fix/**", "refactor/**"]
    paths:
      - "src/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/windows-exe.yml"
  pull_request:
    paths:
      - "src/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/windows-exe.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package and packager
        run: |
          python -m pip install .
          python -m pip install pyinstaller
      - name: Build single-file executable
        run: >-
          python -m PyInstaller
          --onefile
          --name JustTestObservability
          --paths src
          packaging/windows_entry.py
      - name: CLI smoke test
        shell: pwsh
        run: |
          & .\dist\JustTestObservability.exe --database "$env:RUNNER_TEMP\telemetry.db" status
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Web UI smoke test
        shell: pwsh
        run: |
          $database = Join-Path $env:RUNNER_TEMP "ui-smoke.db"
          $process = Start-Process -FilePath ".\dist\JustTestObservability.exe" -ArgumentList "--database", $database, "serve", "--port", "18127" -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Seconds 1
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:18127/" -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200 -and $response.Content -match "Observability Overview") {
                  $ready = $true
                  break
                }
              } catch {
                # The one-file bootstrap can take a few seconds on a cold Windows runner.
              }
            }
            if (-not $ready) { throw "Web UI did not become ready" }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: JustTestObservability-windows-x64
          path: dist/JustTestObservability.exe
          if-no-files-found: error
